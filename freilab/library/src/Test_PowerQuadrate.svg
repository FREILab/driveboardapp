<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="85mm" height="14mm" viewBox="0 0 85 14">
  <!-- Test_PowerQuadrate: 6 squares of 10 mm at 100 %, one feed per square, v1 left to v6 right -->
  <text x="0" y="1">=param:v1:2000:100:6000:Vorschub Quadrat 1=</text>
  <text x="0" y="1">=param:v2:1900:100:6000:Vorschub Quadrat 2=</text>
  <text x="0" y="1">=param:v3:1800:100:6000:Vorschub Quadrat 3=</text>
  <text x="0" y="1">=param:v4:1700:100:6000:Vorschub Quadrat 4=</text>
  <text x="0" y="1">=param:v5:1600:100:6000:Vorschub Quadrat 5=</text>
  <text x="0" y="1">=param:v6:1500:100:6000:Vorschub Quadrat 6=</text>
  <text x="0" y="1">=pass1:2000:15:#02ffff=</text>
  <text x="0" y="1">=pass2:{{round(v1)}}:100:#000000=</text>
  <text x="0" y="1">=pass3:{{round(v2)}}:100:#ff0000=</text>
  <text x="0" y="1">=pass4:{{round(v3)}}:100:#00ff00=</text>
  <text x="0" y="1">=pass5:{{round(v4)}}:100:#0000ff=</text>
  <text x="0" y="1">=pass6:{{round(v5)}}:100:#fffb11=</text>
  <text x="0" y="1">=pass7:{{round(v6)}}:100:#ff02de=</text>
  <g fill="none" stroke-width="0.1">
    <rect x="0" y="0" width="10" height="10" stroke="#000000"/>
    <rect x="15" y="0" width="10" height="10" stroke="#ff0000"/>
    <rect x="30" y="0" width="10" height="10" stroke="#00ff00"/>
    <rect x="45" y="0" width="10" height="10" stroke="#0000ff"/>
    <rect x="60" y="0" width="10" height="10" stroke="#fffb11"/>
    <rect x="75" y="0" width="10" height="10" stroke="#ff02de"/>
  </g>
  <text x="5" y="5.7" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v1)}}</text>
  <text x="5" y="13.4" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v1)}}</text>
  <text x="20" y="5.7" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v2)}}</text>
  <text x="20" y="13.4" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v2)}}</text>
  <text x="35" y="5.7" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v3)}}</text>
  <text x="35" y="13.4" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v3)}}</text>
  <text x="50" y="5.7" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v4)}}</text>
  <text x="50" y="13.4" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v4)}}</text>
  <text x="65" y="5.7" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v5)}}</text>
  <text x="65" y="13.4" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v5)}}</text>
  <text x="80" y="5.7" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v6)}}</text>
  <text x="80" y="13.4" fill="#02ffff" font-family="DejaVu Sans" font-size="2" text-anchor="middle">{{round(v6)}}</text>
</svg>
